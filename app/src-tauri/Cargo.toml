[package]
name = "pyren"
version = "0.1.0"
description = "Pyren - gaming hub for Linux"
authors = ["pyren contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pyren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds must embed the frontend rather than load it from the
# dev server. Without this feature `tauri`'s build script sets `cfg(dev)`
# and `generate_context!` ships an *empty* asset set whenever `devUrl` is
# configured (tauri-codegen context.rs: `dev && dev_url.is_some()`), so a
# `cargo build --release` alone produces an app that only works with
# `vite dev` running. `tauri build` enables this; a manual release build
# needs `--features custom-protocol`. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# One running app per user. Without it a second launch is a second process
# with its own window, and the two race each other's writes to
# ~/.config/pyren/{app,ui}.json (whole-file, last-writer-wins - no merge).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For the group checks in `admin`: the group database and the groups this
# session actually carries are different questions, and only the kernel can
# answer the second.
libc = "0.2"
# Shared with the daemon on purpose: both processes persist small JSON
# config files and both need the same atomic-write, corruption-recovery and
# versioning behaviour. The two remain separate Cargo workspaces and ship as
# separate binaries; this is one small library crate in common, not a merge.
pyren-config = { path = "../../daemon/crates/config" }

# What `tools/release.sh` builds. `thin` rather than fat LTO on purpose:
# this crate pulls in ~490 others (WebKitGTK/GTK bindings), and a fat-LTO
# release link is minutes of wall time for a few percent. `strip` keeps the
# packaged binary small; the frontend is already embedded by
# `tauri::generate_context!`, so this ELF is the whole app.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

