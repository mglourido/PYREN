<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Logo estrella azul y verde">
  <defs>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#54C7FF"/>
      <stop offset="48%" stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0647C8"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B86B"/>
      <stop offset="52%" stop-color="#20D66B"/>
      <stop offset="100%" stop-color="#44D7D2"/>
    </linearGradient>

    <linearGradient id="blueShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B45C8" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#34B8FF" stop-opacity=".12"/>
    </linearGradient>

    <linearGradient id="greenShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3DD84B" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#17B9AF" stop-opacity=".12"/>
    </linearGradient>

    <!-- Segmento base: de la punta superior a la punta izquierda -->
    <path id="arm"
      d="M128 18
         C121 43 111 65 92 84
         C74 101 51 116 26 132
         L55 154
         C81 137 103 120 119 103
         C137 84 148 63 148 43
         C148 31 141 22 128 18
         Z"/>
  </defs>

  <!-- Base interlazada -->
  <use href="#arm" fill="url(#blue)"/>
  <use href="#arm" fill="url(#green)" transform="rotate(90 128 128)"/>
  <use href="#arm" fill="url(#blue)" transform="rotate(180 128 128)"/>
  <use href="#arm" fill="url(#green)" transform="rotate(270 128 128)"/>

  <!-- Sombras suaves en los solapes -->
  <path d="M55 154 C74 141 89 130 101 119 C111 111 118 103 124 94
           C118 112 108 126 94 138 C82 148 69 157 58 164 Z"
        fill="url(#blueShade)" opacity=".75"/>

  <path d="M154 55 C141 74 130 89 119 101 C111 111 103 118 94 124
           C112 118 126 108 138 94 C148 82 157 69 164 58 Z"
        fill="url(#greenShade)" opacity=".62"/>

  <path d="M201 102 C182 115 167 126 155 137 C145 145 138 153 132 162
           C138 144 148 130 162 118 C174 108 187 99 198 92 Z"
        fill="url(#blueShade)" opacity=".55"/>

  <path d="M102 201 C115 182 126 167 137 155 C145 145 153 138 162 132
           C144 138 130 148 118 162 C108 174 99 187 92 198 Z"
        fill="url(#greenShade)" opacity=".52"/>
</svg>
