# The checks from dev/README.md's "Verifying a change", run on every push.
#
# Split into four jobs rather than one so a red badge says *which* half
# broke: the daemon and the app are separate Cargo workspaces shipping as
# separate binaries, and the shell check needs nothing at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: daemon (test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      # Runs the parity test too, under dash rather than the developer's
      # shell - which is the point of a POSIX sh script.
      - run: cargo test --workspace
        working-directory: daemon
      # The CLIs' help text is the only documentation most people will
      # read, and pyren-check's is what a stranger reads first.
      - run: cargo run -q -p pyren-ctl -- --help
        working-directory: daemon
      - run: cargo run -q -p pyren-check -- --help
        working-directory: daemon
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: daemon
      - run: cargo fmt --all -- --check
        working-directory: daemon

  app:
    name: app (svelte-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run check
        working-directory: app
      - run: bun run build
        working-directory: app

  tauri:
    name: tauri shell (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # webkit2gtk and friends are not on the runner image; without them
      # the Tauri crates fail at their build scripts, not at compile time.
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo check --all-targets
        working-directory: app/src-tauri

  osd:
    name: osd (test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Its own workspace, and the reason for that is this list: the daemon
      # is a system service and must keep building on a machine with no GUI
      # libraries at all.
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev meson ninja-build libwayland-dev wayland-protocols
      # libgtk4-layer-shell-dev is not packaged for Ubuntu until 25.10
      # (questing) - ubuntu-latest is 24.04, which has no such package at
      # all - so the native library is built from source here, pinned to
      # the same release the project's own install docs tell an Arch user
      # to `pacman -S`.
      - run: |
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup -Dintrospection=false -Dvapi=false -Dexamples=false \
            -Ddocs=false -Dtests=false build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: osd
      # The tests include the two that keep the widget's icons and its
      # mode names identical to the app's, by reading the app's own files.
      - run: cargo test
        working-directory: osd
      - run: cargo run -q -- --help
        working-directory: osd
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: osd
      - run: cargo fmt -p pyren-osd -- --check
        working-directory: osd

  shell:
    name: shell scripts (syntax + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sh -n tools/pyren-check.sh
      # power-soak.sh drives real firmware, so CI can only check that it
      # parses - which is still the failure it would otherwise ship.
      - run: sh -n tools/power-soak.sh
      # severity=warning: skip style/info nits so this catches real bugs
      # (bad quoting, unset vars) without failing on the script's own style.
      - run: shellcheck --severity=warning tools/pyren-check.sh tools/power-soak.sh
