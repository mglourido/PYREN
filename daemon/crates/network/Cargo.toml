[package]
name = "pyren-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pyren-core = { path = "../core" }
pyren-config = { path = "../config" }
# Loads the eBPF object behind per-process accounting (`src/bpf.rs`). The
# alternative to a loader is not "no dependency", it is parsing ELF, BTF
# and relocations by hand to make the same handful of `bpf(2)` calls.
aya = "0.14"
# geteuid(2), to tell "not root" apart from "this kernel said no".
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Parses the embedded object in a test, which - unlike loading it - needs
# no privileges. Already in the tree as aya's own dependency.
aya-obj = "0.3"
