[package]
name = "pyren-hotkey"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pyren-core = { path = "../core" }
pyren-config = { path = "../config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For the kernel's own input interface: struct input_event's timeval, the
# O_NONBLOCK open and poll(2). No evdev crate - this is all of it.
libc = "0.2"
