[package]
name = "pyren-system"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pyren-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for statvfs(3) - free space on a mount point has no /proc or /sys
# equivalent, so it has to be the syscall.
libc = "0.2"
